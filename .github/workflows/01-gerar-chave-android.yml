name: 01 - Gerar chave Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-chave:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar segredos
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$STORE_PASSWORD" ] || { echo "Defina ANDROID_KEYSTORE_PASSWORD em Settings > Secrets and variables > Actions."; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Defina ANDROID_KEY_ALIAS em Settings > Secrets and variables > Actions."; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Defina ANDROID_KEY_PASSWORD em Settings > Secrets and variables > Actions."; exit 1; }

      - name: Criar chave de assinatura
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore smart-finance-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Smart Finance, OU=Aplicativo Pessoal, O=Smart Finance, L=Crato, ST=Ceara, C=BR"

          keytool -list -v \
            -keystore smart-finance-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > informacoes-chave.txt

          base64 -w 0 smart-finance-release.jks > keystore-base64.txt
          echo "SHA-1 da chave:" >> "$GITHUB_STEP_SUMMARY"
          grep -m1 "SHA1:" informacoes-chave.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artefato, guarde o arquivo .jks e copie o conteúdo de keystore-base64.txt para o segredo ANDROID_KEYSTORE_BASE64." >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar chave para download
        uses: actions/upload-artifact@v4
        with:
          name: chave-smart-finance
          path: |
            smart-finance-release.jks
            keystore-base64.txt
            informacoes-chave.txt
          retention-days: 7
